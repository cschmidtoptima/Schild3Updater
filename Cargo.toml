[package]
name = "schild3-updater"
version = "0.2.0"
edition = "2021"
description = "Windows-Updater für SchILD3 mit SVWS-Kompatibilitätsprüfung, Sicherungen und GitHub-Selbstaktualisierung."
repository = "https://github.com/cschmidtoptima/Schild3Updater"
readme = "README.md"
license = "MIT"

[dependencies]
anyhow = "1"
eframe = "0.29"
egui_extras = { version = "0.29", features = ["svg"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
self-replace = "1.5"
sha2 = "0.10"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Diagnostics_Debug"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
resvg = { version = "0.45", default-features = false }
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true